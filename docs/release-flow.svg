<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910">
<style>
text{font-family:Inter,Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2933}
.h{font-size:20px;font-weight:600}.sub{font-size:12px;fill:#52606d}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#3e4c59}.k{font-size:11px;font-weight:600;fill:#7b8794;letter-spacing:.08em}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#1f2933}
.box{stroke:#9aa5b1;stroke-width:1.2}
.chip{fill:#ffffff;stroke:#7fa6d6;stroke-width:1.1}
.chipo{fill:#ffffff;stroke:#b3bcc6;stroke-width:1;stroke-dasharray:3 2}
.blue{fill:#e3f0ff}.green{fill:#e3f9e5}.amber{fill:#fff3d6}.gray{fill:#f5f7fa}
.arr{stroke:#52606d;stroke-width:1.6;fill:none;marker-end:url(#a)}
.flow{stroke:#7fa6d6;stroke-width:1.3;fill:none;marker-end:url(#b)}
.dash{stroke-dasharray:6 4}
.lbl{font-size:11px;fill:#52606d}
.legacy{stroke:#c0392b;stroke-dasharray:5 3}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa6d6"/></marker></defs>
<rect width="1200" height="910" fill="#ffffff"/>
<text class="h" x="24" y="38" text-anchor="start">How a component publishes with wire-rm-actions</text>
<text class="sub" x="24" y="58" text-anchor="start">Its workflows call the actions (pills, in run order; dashed where a component needs them). Every arrow is a write outside the repository.</text>
<rect class="box blue" x="24" y="84" width="340" height="800" rx="10"/>
<text class="t" x="38" y="108" text-anchor="start">Dev build</text>
<text class="sub" x="38" y="126" text-anchor="start">on every push to dev or release/*</text>
<rect class="chip" x="44" y="145" width="300" height="26" rx="13"/>
<text class="code" x="57" y="162" text-anchor="start">checkout</text>
<text class="lbl" x="332" y="162" text-anchor="end">fetch-depth: 0</text>
<rect class="chip" x="44" y="193" width="300" height="26" rx="13"/>
<text class="code" x="57" y="210" text-anchor="start">version</text>
<text class="s" x="74" y="240" text-anchor="start">next patch + timestamp + commit:</text>
<text class="code" x="74" y="258" text-anchor="start">5.2.2-20260930120000.gabcdef0</text>
<text class="s" x="74" y="276" text-anchor="start">a tag build gets the tag itself</text>
<rect class="chipo" x="44" y="367" width="300" height="26" rx="13"/>
<text class="code" x="57" y="384" text-anchor="start">quay-login</text>
<text class="lbl" x="332" y="384" text-anchor="end">OIDC</text>
<text class="s" x="74" y="414" text-anchor="start">job token for a 1-hour robot token:</text>
<text class="s" x="74" y="432" text-anchor="start">no registry password to store</text>
<rect class="chip" x="44" y="515" width="300" height="26" rx="13"/>
<text class="code" x="57" y="532" text-anchor="start">build-image</text>
<text class="lbl" x="332" y="532" text-anchor="end">images first</text>
<rect class="chip" x="44" y="595" width="300" height="26" rx="13"/>
<text class="code" x="57" y="612" text-anchor="start">publish-chart</text>
<text class="lbl" x="332" y="612" text-anchor="end">chart-path</text>
<rect class="chip" x="44" y="647" width="300" height="26" rx="13"/>
<text class="code" x="57" y="664" text-anchor="start">release-manifest</text>
<text class="lbl" x="332" y="664" text-anchor="end">write</text>
<rect class="chip" x="44" y="729" width="300" height="26" rx="13"/>
<text class="code" x="57" y="746" text-anchor="start">notify-rm</text>
<text class="s" x="74" y="786" text-anchor="start">chart-only component: the reusable</text>
<text class="s" x="74" y="804" text-anchor="start">workflow dev-build.yml does all of it</text>
<path class="flow" d="M60,171 L60,193"/>
<path class="flow" d="M60,219 L60,367"/>
<path class="flow" d="M60,393 L60,515"/>
<path class="flow" d="M60,541 L60,595"/>
<path class="flow" d="M60,621 L60,647"/>
<path class="flow" d="M60,673 L60,729"/>
<text class="k" x="432" y="478" text-anchor="start">WHERE IT LANDS</text>
<rect class="box green" x="432" y="494" width="330" height="68" rx="10"/>
<text class="t" x="446" y="518" text-anchor="start">Container image</text>
<text class="code" x="446" y="536" text-anchor="start">quay.io/wire/&lt;component&gt;</text>
<text class="s" x="446" y="554" text-anchor="start">never overwritten; attested unless it expires</text>
<rect class="box green" x="432" y="574" width="330" height="68" rx="10"/>
<text class="t" x="446" y="598" text-anchor="start">Helm chart (OCI)</text>
<text class="code" x="446" y="616" text-anchor="start">oci://quay.io/wire/charts/&lt;channel&gt;/&lt;name&gt;</text>
<text class="s" x="446" y="634" text-anchor="start">channel dev or stable; version == appVersion</text>
<rect class="box gray legacy" x="432" y="802" width="330" height="68" rx="10"/>
<text class="t" x="446" y="826" text-anchor="start">S3 Helm repository (interim)</text>
<text class="s" x="446" y="844" text-anchor="start">helm-s3, for deployments that still read one</text>
<text class="s" x="446" y="862" text-anchor="start">same package again = no-op</text>
<rect class="box green" x="432" y="696" width="330" height="92" rx="10"/>
<text class="t" x="446" y="720" text-anchor="start">Release managers</text>
<text class="s" x="446" y="738" text-anchor="start">staging and prod</text>
<text class="code" x="446" y="756" text-anchor="start">POST /api/v1/versions</text>
<text class="s" x="446" y="774" text-anchor="start">version, artifact, provenance, manifest</text>
<rect class="box blue" x="836" y="84" width="340" height="214" rx="10"/>
<text class="t" x="850" y="108" text-anchor="start">Prepare release</text>
<text class="sub" x="850" y="126" text-anchor="start">dispatched on dev or release/X.Y, by hand or by RM</text>
<rect class="chip" x="850" y="141" width="146" height="26" rx="13"/>
<text class="code" x="863" y="158" text-anchor="start">release-inputs</text>
<rect class="chip" x="1002" y="141" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="158" text-anchor="start">release-source</text>
<rect class="chip" x="850" y="171" width="146" height="26" rx="13"/>
<text class="code" x="863" y="188" text-anchor="start">version</text>
<rect class="chip" x="1002" y="171" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="188" text-anchor="start">release-documents</text>
<rect class="chip" x="850" y="201" width="146" height="26" rx="13"/>
<text class="code" x="863" y="218" text-anchor="start">compatibility</text>
<rect class="chip" x="1002" y="201" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="218" text-anchor="start">ci-gate</text>
<rect class="chipo" x="850" y="231" width="146" height="26" rx="13"/>
<text class="code" x="863" y="248" text-anchor="start">build-image</text>
<rect class="chip" x="1002" y="231" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="248" text-anchor="start">release-manifest</text>
<rect class="chip" x="850" y="261" width="146" height="26" rx="13"/>
<text class="code" x="863" y="278" text-anchor="start">changelog</text>
<rect class="chip" x="1002" y="261" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="278" text-anchor="start">draft-release</text>
<rect class="box green" x="836" y="310" width="340" height="80" rx="10"/>
<text class="t" x="850" y="334" text-anchor="start">GitHub Release vX.Y.Z (draft)</text>
<text class="s" x="850" y="352" text-anchor="start">assets: manifest, chart package, note,</text>
<text class="s" x="850" y="370" text-anchor="start">declaration; its publication creates the tag</text>
<path class="arr" d="M1006,298 L1006,310"/>
<rect class="box amber" x="836" y="406" width="340" height="34" rx="17"/>
<text class="s" x="1006.0" y="428" text-anchor="middle">a release manager approves (release-publication)</text>
<path class="arr" d="M1006,390 L1006,406"/>
<rect class="box blue" x="836" y="456" width="340" height="428" rx="10"/>
<text class="t" x="850" y="480" text-anchor="start">Publish release</text>
<path class="arr" d="M1006,440 L1006,456"/>
<rect class="chip" x="856" y="487" width="300" height="26" rx="13"/>
<text class="code" x="869" y="504" text-anchor="start">draft-release resolve</text>
<text class="lbl" x="1144" y="504" text-anchor="end">+ manifest verify</text>
<rect class="chip" x="856" y="527" width="300" height="26" rx="13"/>
<text class="code" x="869" y="544" text-anchor="start">promote-image</text>
<text class="lbl" x="1144" y="544" text-anchor="end">by digest</text>
<rect class="chip" x="856" y="595" width="300" height="26" rx="13"/>
<text class="code" x="869" y="612" text-anchor="start">publish-chart</text>
<text class="lbl" x="1144" y="612" text-anchor="end">chart-file</text>
<rect class="chip" x="856" y="639" width="300" height="26" rx="13"/>
<text class="code" x="869" y="656" text-anchor="start">release-manifest complete</text>
<rect class="chip" x="856" y="683" width="300" height="26" rx="13"/>
<text class="code" x="869" y="700" text-anchor="start">draft-release publish</text>
<text class="lbl" x="1144" y="700" text-anchor="end">creates the tag</text>
<rect class="chip" x="856" y="729" width="300" height="26" rx="13"/>
<text class="code" x="869" y="746" text-anchor="start">notify-rm</text>
<text class="lbl" x="1144" y="746" text-anchor="end">+ declaration</text>
<rect class="chipo" x="856" y="823" width="300" height="26" rx="13"/>
<text class="code" x="869" y="840" text-anchor="start">publish-chart-s3</text>
<text class="lbl" x="1144" y="840" text-anchor="end">if needed</text>
<path class="flow" d="M872,513 L872,527"/>
<path class="flow" d="M872,553 L872,595"/>
<path class="flow" d="M872,621 L872,639"/>
<path class="flow" d="M872,665 L872,683"/>
<path class="flow" d="M872,709 L872,729"/>
<path class="flow" d="M872,755 L872,823"/>
<path class="arr" d="M1156,696 L1190,696 L1190,350 L1176,350"/>
<path class="arr dash" d="M850,244 L806,244 L806,514 L762,514"/>
<text class="lbl" x="798" y="372" text-anchor="end">candidate image,</text>
<text class="lbl" x="798" y="386" text-anchor="end">when built here</text>
<path class="arr" d="M344,528 L432,528"/>
<text class="lbl" x="388.0" y="522" text-anchor="middle">dev tag</text>
<path class="arr" d="M344,608 L432,608"/>
<text class="lbl" x="388.0" y="602" text-anchor="middle">charts/dev</text>
<path class="arr" d="M344,742 L432,742"/>
<text class="lbl" x="388.0" y="736" text-anchor="middle">dev build</text>
<path class="arr" d="M856,540 L762,540"/>
<text class="lbl" x="809.0" y="554" text-anchor="middle">release tag</text>
<path class="arr" d="M856,608 L762,608"/>
<text class="lbl" x="809.0" y="602" text-anchor="middle">GA: stable</text>
<text class="lbl" x="809.0" y="622" text-anchor="middle">pre: dev</text>
<path class="arr" d="M856,836 L762,836"/>
<text class="lbl" x="809.0" y="830" text-anchor="middle">same .tgz</text>
<path class="arr" d="M856,742 L762,742"/>
<text class="lbl" x="809.0" y="736" text-anchor="middle">release</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:Inter,Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2933}
.h{font-size:20px;font-weight:600}.sub{font-size:12px;fill:#52606d}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#3e4c59}.k{font-size:11px;font-weight:600;fill:#7b8794;letter-spacing:.08em}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#1f2933}
.box{stroke:#9aa5b1;stroke-width:1.2}
.chip{fill:#ffffff;stroke:#7fa6d6;stroke-width:1.1}
.chipo{fill:#ffffff;stroke:#b3bcc6;stroke-width:1;stroke-dasharray:3 2}
.blue{fill:#e3f0ff}.green{fill:#e3f9e5}.amber{fill:#fff3d6}.gray{fill:#f5f7fa}
.arr{stroke:#52606d;stroke-width:1.6;fill:none;marker-end:url(#a)}
.flow{stroke:#7fa6d6;stroke-width:1.3;fill:none;marker-end:url(#b)}
.lbl{font-size:11px;fill:#52606d}
.legacy{stroke:#c0392b;stroke-dasharray:5 3}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa6d6"/></marker></defs>
<rect width="1200" height="880" fill="#ffffff"/>
<text class="h" x="24" y="38" text-anchor="start">How a component publishes with wire-rm-actions</text>
<text class="sub" x="24" y="58" text-anchor="start">Its workflows call the actions (pills, in run order). Every arrow is something written outside the repository.</text>
<rect class="box blue" x="24" y="84" width="340" height="766" rx="10"/>
<text class="t" x="38" y="108" text-anchor="start">Dev build</text>
<text class="sub" x="38" y="126" text-anchor="start">on every push to dev or release/*</text>
<rect class="chip" x="44" y="145" width="300" height="26" rx="13"/>
<text class="code" x="57" y="162" text-anchor="start">checkout</text>
<text class="lbl" x="332" y="162" text-anchor="end">fetch-depth: 0</text>
<rect class="chip" x="44" y="193" width="300" height="26" rx="13"/>
<text class="code" x="57" y="210" text-anchor="start">version</text>
<text class="s" x="48" y="240" text-anchor="start">next patch + timestamp + commit:</text>
<text class="code" x="48" y="258" text-anchor="start">5.2.2-20260930120000.gabcdef0</text>
<text class="s" x="48" y="276" text-anchor="start">a tag build gets the tag itself</text>
<rect class="chipo" x="44" y="367" width="300" height="26" rx="13"/>
<text class="code" x="57" y="384" text-anchor="start">quay-login</text>
<text class="lbl" x="332" y="384" text-anchor="end">OIDC</text>
<text class="s" x="48" y="414" text-anchor="start">job token for a 1-hour robot token:</text>
<text class="s" x="48" y="432" text-anchor="start">no registry password to store</text>
<rect class="chip" x="44" y="515" width="300" height="26" rx="13"/>
<text class="code" x="57" y="532" text-anchor="start">build-image</text>
<text class="lbl" x="332" y="532" text-anchor="end">images first</text>
<rect class="chip" x="44" y="595" width="300" height="26" rx="13"/>
<text class="code" x="57" y="612" text-anchor="start">publish-chart</text>
<text class="lbl" x="332" y="612" text-anchor="end">chart-path</text>
<text class="s" x="48" y="646" text-anchor="start">image tag = appVersion = version:</text>
<text class="s" x="48" y="664" text-anchor="start">the chart pulls the image of its build</text>
<rect class="chip" x="44" y="765" width="300" height="26" rx="13"/>
<text class="code" x="57" y="782" text-anchor="start">notify-rm</text>
<text class="s" x="48" y="822" text-anchor="start">chart-only component: the reusable</text>
<text class="s" x="48" y="840" text-anchor="start">workflow dev-build.yml does all of it</text>
<path class="flow" d="M194,171 L194,193"/>
<path class="flow" d="M194,219 L194,367"/>
<path class="flow" d="M194,393 L194,515"/>
<path class="flow" d="M194,541 L194,595"/>
<path class="flow" d="M194,621 L194,765"/>
<text class="k" x="432" y="478" text-anchor="start">WHERE IT LANDS</text>
<rect class="box green" x="432" y="494" width="330" height="68" rx="10"/>
<text class="t" x="446" y="518" text-anchor="start">Container image</text>
<text class="code" x="446" y="536" text-anchor="start">quay.io/wire/&lt;component&gt;</text>
<text class="s" x="446" y="554" text-anchor="start">attestations; a pushed tag never changes</text>
<rect class="box green" x="432" y="574" width="330" height="68" rx="10"/>
<text class="t" x="446" y="598" text-anchor="start">Helm chart (OCI)</text>
<text class="code" x="446" y="616" text-anchor="start">oci://quay.io/wire/charts/&lt;channel&gt;/&lt;name&gt;</text>
<text class="s" x="446" y="634" text-anchor="start">channel dev or stable; version == appVersion</text>
<rect class="box gray legacy" x="432" y="654" width="330" height="68" rx="10"/>
<text class="t" x="446" y="678" text-anchor="start">S3 Helm repository (interim)</text>
<text class="s" x="446" y="696" text-anchor="start">helm-s3, for deployments that still read one</text>
<text class="s" x="446" y="714" text-anchor="start">same package again = no-op</text>
<rect class="box green" x="432" y="732" width="330" height="92" rx="10"/>
<text class="t" x="446" y="756" text-anchor="start">Release managers</text>
<text class="s" x="446" y="774" text-anchor="start">staging and prod</text>
<text class="code" x="446" y="792" text-anchor="start">POST /api/v1/versions</text>
<text class="s" x="446" y="810" text-anchor="start">version, artifact, provenance, manifest</text>
<rect class="box blue" x="836" y="84" width="340" height="214" rx="10"/>
<text class="t" x="850" y="108" text-anchor="start">Prepare release</text>
<text class="sub" x="850" y="126" text-anchor="start">manual dispatch, on the release branch</text>
<rect class="chip" x="850" y="141" width="146" height="26" rx="13"/>
<text class="code" x="863" y="158" text-anchor="start">release-inputs</text>
<rect class="chip" x="1002" y="141" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="158" text-anchor="start">release-source</text>
<rect class="chip" x="850" y="171" width="146" height="26" rx="13"/>
<text class="code" x="863" y="188" text-anchor="start">ci-gate</text>
<rect class="chip" x="1002" y="171" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="188" text-anchor="start">version</text>
<rect class="chip" x="850" y="201" width="146" height="26" rx="13"/>
<text class="code" x="863" y="218" text-anchor="start">changelog</text>
<rect class="chip" x="1002" y="201" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="218" text-anchor="start">release-declaration</text>
<rect class="chip" x="850" y="231" width="146" height="26" rx="13"/>
<text class="code" x="863" y="248" text-anchor="start">release-documents</text>
<rect class="chip" x="1002" y="231" width="160" height="26" rx="13"/>
<text class="code" x="1015" y="248" text-anchor="start">release-manifest</text>
<rect class="chip" x="850" y="261" width="146" height="26" rx="13"/>
<text class="code" x="863" y="278" text-anchor="start">draft-release</text>
<text class="lbl" x="1014" y="278" text-anchor="start">in order, row by row;</text>
<text class="lbl" x="1014" y="292" text-anchor="start">version in release mode</text>
<rect class="box green" x="836" y="310" width="340" height="80" rx="10"/>
<text class="t" x="850" y="334" text-anchor="start">GitHub Release vX.Y.Z (draft)</text>
<text class="s" x="850" y="352" text-anchor="start">assets: manifest, chart package, note,</text>
<text class="s" x="850" y="370" text-anchor="start">declaration; published last, creating the tag</text>
<path class="arr" d="M1006,298 L1006,310"/>
<rect class="box amber" x="836" y="406" width="340" height="34" rx="17"/>
<text class="s" x="1006.0" y="428" text-anchor="middle">a release manager approves (release-publication)</text>
<path class="arr" d="M1006,390 L1006,406"/>
<rect class="box blue" x="836" y="456" width="340" height="394" rx="10"/>
<text class="t" x="850" y="480" text-anchor="start">Publish release</text>
<path class="arr" d="M1006,440 L1006,456"/>
<rect class="chip" x="856" y="487" width="300" height="26" rx="13"/>
<text class="code" x="869" y="504" text-anchor="start">draft-release resolve</text>
<text class="lbl" x="1144" y="504" text-anchor="end">+ manifest verify</text>
<rect class="chip" x="856" y="527" width="300" height="26" rx="13"/>
<text class="code" x="869" y="544" text-anchor="start">promote-image</text>
<text class="lbl" x="1144" y="544" text-anchor="end">by digest</text>
<rect class="chip" x="856" y="595" width="300" height="26" rx="13"/>
<text class="code" x="869" y="612" text-anchor="start">publish-chart</text>
<text class="lbl" x="1144" y="612" text-anchor="end">chart-file</text>
<rect class="chipo" x="856" y="675" width="300" height="26" rx="13"/>
<text class="code" x="869" y="692" text-anchor="start">publish-chart-s3</text>
<text class="lbl" x="1144" y="692" text-anchor="end">if needed</text>
<rect class="chip" x="856" y="719" width="300" height="26" rx="13"/>
<text class="code" x="869" y="736" text-anchor="start">release-manifest complete</text>
<rect class="chip" x="856" y="765" width="300" height="26" rx="13"/>
<text class="code" x="869" y="782" text-anchor="start">notify-rm</text>
<text class="lbl" x="1144" y="782" text-anchor="end">+ declaration</text>
<rect class="chip" x="856" y="809" width="300" height="26" rx="13"/>
<text class="code" x="869" y="826" text-anchor="start">draft-release publish</text>
<text class="lbl" x="1144" y="826" text-anchor="end">last</text>

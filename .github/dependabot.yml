version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7 # let a compromised release be caught before it lands here
    groups:
      actions:
        patterns: ["*"]
  # The hashed Python tools of make ci (requirements-ci.in, compiled by pip-compile).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
